[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dot"
version = "1.1.1"
description = "Autonomous 2D air-core superconducting dipole optimization and certification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Mattia Elisei"},
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["accelerator", "dipole", "magnet", "optimization", "superconducting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.7",
    # Numba 0.66 supports NumPy through 2.4.  Keeping the upper bound here
    # means the optional acceleration extra can always be installed into the
    # same environment as the core application.
    "numpy>=1.26,<2.5",
    "pymoo>=0.6.1,<0.7",
]

[project.optional-dependencies]
acceleration = [
    "numba>=0.66,<0.67",
]
dev = [
    "build",
    "pytest",
    "ruff==0.16.1",
]
[project.scripts]
dot = "dot.cli:main"
dot-gui = "dot.gui.target_synthesis_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dot = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep DOT's lint contract explicit. Ruff 0.16 expanded its implicit default
# from 59 to 413 rules, which made otherwise unchanged releases fail CI.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: convergence or extended numerical benchmark tests not run in the default CI job",
    "live_roxie: optional tests requiring a licensed local ROXIE installation",
]
